<!DOCTYPE html>
<!-- iPhone/iPad home-screen icon. Rendered to apple-touch-icon.png at 180x180 by tools/render-images.ps1.
     The favicon's circle (white → cyan → magenta, soft violet crescent bottom-right) on the site's dark background,
     with a faint glow. iOS rounds the corners itself, so the background fills the whole square. -->
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  body { display: grid; place-items: center;
    background: radial-gradient(circle at 50% 50%, rgba(138, 43, 255, .35), transparent 65%), #07030f; }
  svg { width: 128px; height: 128px; filter: drop-shadow(0 0 12px rgba(0, 240, 255, .45)); }
</style>
</head>
<body>
  <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/>
      </linearGradient>
      <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      <mask id="m">
        <circle cx="16" cy="16" r="15" fill="#fff"/>
        <circle cx="11" cy="11" r="13" fill="#000" filter="url(#b)"/>
      </mask>
    </defs>
    <circle cx="16" cy="16" r="15" fill="url(#g)"/>
    <circle cx="16" cy="16" r="15" fill="#8a2bff" opacity=".9" mask="url(#m)"/>
  </svg>
  <script>window.__ready = true;</script>
</body>
</html>
